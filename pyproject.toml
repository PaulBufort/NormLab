[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "normlab"
version = "0.1.0"
description = "GPT-5.6 Sol designs organizational change experiments; a deterministic threshold engine adjudicates them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Paul Bufort" }]
dependencies = [
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "openai>=2,<3",
  "pandas>=2.1,<4",
  "pydantic>=2.8,<3",
  "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["normlab*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
